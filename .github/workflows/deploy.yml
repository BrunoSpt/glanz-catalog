name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  # Superseded PR builds can be cancelled; a deploy in progress is never interrupted
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Also validates src/_data (see scripts/validate-data.js); a data mistake fails here
      - run: npm run build

      # End-to-end tests on iPhone (WebKit, Safari's engine) and desktop (Chromium);
      # a failure here stops the deploy
      - run: npx playwright install --with-deps webkit chromium
      - run: npm test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: site
          path: _site/
          retention-days: 7

  # The site: Cloudflare Pages (https://glanzsemijoias.pages.dev/)
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: ${{ steps.deployment.outputs.deployment-url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: _site

      # CLOUDFLARE_API_TOKEN (permission: Account > Cloudflare Pages > Edit) and
      # CLOUDFLARE_ACCOUNT_ID are repository secrets (Settings > Secrets and variables > Actions)
      - id: deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=glanzsemijoias --branch=main

